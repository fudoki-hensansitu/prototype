name: deploy
# main に merge されたら prototype.fudoki.dev へ deploy する。
# 雛形は `void init --github`（Cloudflare 向け）。toolchain は mise に揃えている。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # 手動起動でも main 以外の branch は本番に出さない
    if: github.ref == 'refs/heads/main'
    # deploy 途中で止めると readiness 確認や rollback が中断するので、後続は待たせる。
    # 本番の Worker は 1 つなので group は ref で分けない。job に置くことで、
    # if で skip される run が待機中の main の deploy を押し出さない
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      # void の CLI は node shebang で動き、engines が node >=24.21.0（mise.toml で固定）
      - run: node --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Deploy
        env:
          # Workers Scripts: Edit と Workers Routes: Edit（fudoki.dev）を持つ API token
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # preview_urls: false の Worker を新しい checkout から deploy するとき、readiness 確認に要る
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # readiness の URL が Access に止められるときだけ要る（service token）
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bunx void deploy --platform cloudflare
      - name: 本番の応答を確かめる
        # Access の login へ redirect されても curl -f は成功するので、200 を要求する
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://prototype.fudoki.dev/__void/ready)
          echo "status=$status"
          test "$status" = 200
