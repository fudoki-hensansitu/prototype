<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>風土記の試作</title>
<style>
:root { --bg: #f7f8fb; --ink: #1a1d24; --muted: #5b6270; --accent: #0031d8; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #12141a; --ink: #e8eaf0; --muted: #a2a9b8; --accent: #8ea6ff; } }
body { background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.7; margin: 0 auto; max-width: 40rem; padding: 40px 16px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 24px; }
ul { list-style: none; margin: 0; padding: 0; }
li + li { margin-top: 12px; }
a { color: var(--accent); font-weight: 700; }
li span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<h1>風土記の試作</h1>
<p>議員・行政向け AI エージェントの画面の試作です。中身はダミーで、実際のデータや AI にはつながっていません。</p>
<ul>
  <li><a href="/giin-agent">giin-agent</a><span>議員の定例会の準備（下調べ・一般質問の素案・議会報告）</span></li>
</ul>
</body>
</html>
